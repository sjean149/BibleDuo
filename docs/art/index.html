<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BibleLingo art</title>
<style>
  body { font-family: system-ui, sans-serif; background: #EEF2F4; color: #16263A; margin: 0; padding: 24px 16px; }
  h1, h2 { max-width: 960px; margin: 0 auto 12px; } h2 { margin-top: 28px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; max-width: 960px; margin: 0 auto; }
  .grid.scenes { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  figure { margin: 0; background: #fff; border-radius: 14px; padding: 12px; text-align: center; }
  figure.wide { padding: 0; overflow: hidden; } figure.wide img { aspect-ratio: 4 / 3; object-fit: cover; }
  img { width: 100%; display: block; } figcaption { font-weight: 700; padding: 8px 0 4px; }
</style>
<h1>BibleLingo art</h1>
<h2>Characters</h2><div class="grid"><figure class=""><img src="character-paul.svg" alt="Paul"><figcaption>Paul</figcaption></figure><figure class=""><img src="character-jesus.svg" alt="Jesus"><figcaption>Jesus</figcaption></figure><figure class=""><img src="character-camel.svg" alt="Camel"><figcaption>Camel</figcaption></figure><figure class=""><img src="character-lamb.svg" alt="Lamb"><figcaption>Lamb</figcaption></figure><figure class=""><img src="character-fish.svg" alt="Fish"><figcaption>Fish</figcaption></figure></div>
<h2>Scenes</h2><div class="grid scenes"><figure class="wide"><img src="scene-sea.svg" alt="Sea of Galilee"><figcaption>Sea of Galilee</figcaption></figure><figure class="wide"><img src="scene-mountain.svg" alt="Mountains"><figcaption>Mountains</figcaption></figure><figure class="wide"><img src="scene-desert.svg" alt="Desert"><figcaption>Desert</figcaption></figure><figure class="wide"><img src="scene-wilderness.svg" alt="Wilderness and the Jordan"><figcaption>Wilderness and the Jordan</figcaption></figure><figure class="wide"><img src="scene-forest.svg" alt="Olive grove"><figcaption>Olive grove</figcaption></figure><figure class="wide"><img src="scene-town.svg" alt="Jerusalem"><figcaption>Jerusalem</figcaption></figure><figure class="wide"><img src="scene-field.svg" alt="Fields and pasture"><figcaption>Fields and pasture</figcaption></figure><figure class="wide"><img src="scene-map.svg" alt="Map of the Holy Land"><figcaption>Map of the Holy Land</figcaption></figure></div>
